<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Imagine Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <h3>Grok Imagine Downloader</h3>
        <p class="subtitle">Download prompts & videos</p>
    </div>

    <div class="section">
        <div class="section-title">Current Content</div>
        <div id="preview">
            <div class="preview-placeholder">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Click to detect content</span>
            </div>
        </div>
        <button id="detectBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            Detect Content
        </button>
    </div>

    <div id="contentFound" class="section" style="display: none;">
        <div class="section-title">Found Content</div>
        <div class="content-summary">
            <div class="summary-item">
                <span class="summary-icon">📝</span>
                <span id="promptPreview">No prompt detected</span>
            </div>
            <div class="summary-item">
                <span class="summary-icon">🎬</span>
                <span id="videoCount">0 videos found</span>
            </div>
        </div>
    </div>

    <div id="downloadSection" class="section" style="display: none;">
        <div class="section-title">Download Options</div>
        <button id="downloadAllBtn" class="primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download All
        </button>
        <button id="downloadPromptBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            Download Prompt Only
        </button>
        <button id="downloadVideosBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M7 3v18" />
                <path d="M3 7.5h4" />
                <path d="M3 12h18" />
                <path d="M3 16.5h4" />
                <path d="M17 3v18" />
                <path d="M17 7.5h4" />
                <path d="M17 16.5h4" />
            </svg>
            Download Videos Only
        </button>
    </div>

    <div id="progress" style="display: none;">
        <h4>Progress</h4>
        <div id="progressText">Ready</div>
    </div>

    <div class="footer">
        Grok Imagine Downloader v1.0
    </div>

    <script src="popup.js"></script>
</body>

</html>
